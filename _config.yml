# ============================================================
#  TECHNICAL SETTINGS - normally you do NOT need to edit this file.
#  Yearly content lives in the _data folder (see EDITING.md).
#  After changing this file, the site must be rebuilt (a push to GitHub does this).
# ============================================================
title: WCCHSC
description: >-
  Western Canadian Catholic Home School Conference
# GO-LIVE: change this url, the CNAME file, and set noindex to false (see EDITING.md)
url: "https://test.wcchsc.net"
noindex: true            # true = ask search engines not to list the site (test site)
baseurl: ""
repository: "jduteau/WCCHSC-Modern"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope: { path: "" }
    values: { layout: "page" }

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - update_bootstrap.sh
  - README.md
  - EDITING.md
  - GOOGLE_FORMS.md
  - LICENSE.md
