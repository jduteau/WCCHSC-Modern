<footer class="bg-dark text-light py-5 mt-5">
  <div class="container">
    <div class="row">
      <div class="col-md-4 mb-4">
        <p class="h5 mb-1">{{ site.data.event.short_name }}</p>
        <p class="small mb-0">{{ site.data.event.name }}</p>
        <p class="small">{% include event-dates.html %}</p>
      </div>
      <div class="col-md-4 mb-4">
        <h5>Useful Links</h5>
        <ul class="list-unstyled">
          <li><a class="link-light" href="{{ '/registration.html' | relative_url }}">Registration</a></li>
          <li><a class="link-light" href="{{ '/terms.html' | relative_url }}">Terms of Use</a></li>
          <li><a class="link-light" href="{{ '/privacy.html' | relative_url }}">Privacy Policy</a></li>
        </ul>
      </div>
      <div class="col-md-4 mb-4">
        <h5>Contact Us</h5>
        <ul class="list-unstyled">
          {%- if site.data.event.facebook != "" -%}
          <li><a class="link-light" href="https://www.facebook.com/{{ site.data.event.facebook }}/">Facebook</a></li>
          {%- endif -%}
          <li><a class="link-light" href="mailto:{{ site.data.event.email.general }}">{{ site.data.event.email.general }}</a></li>
        </ul>
      </div>
    </div>
  </div>
</footer>
