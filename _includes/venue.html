<section id="location" class="py-5">
  <div class="container">
    <h2 class="text-center mb-4">Location</h2>
    <div class="row g-4 align-items-center">
      <div class="col-lg-7">
        <div class="ratio ratio-16x9">
          <iframe src="{{ site.data.venue.map_embed_url }}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" style="border:0" allowfullscreen title="Map of {{ site.data.venue.name }}"></iframe>
        </div>
      </div>
      <div class="col-lg-5 text-center text-lg-start">
        <h3>{{ site.data.venue.name }}</h3>
        <p class="lead">{{ site.data.venue.address }}</p>
      </div>
    </div>
  </div>
</section>
