# FAQ - one entry per question. Answers can use Markdown (links, **bold**).
# For long answers write "answer: |" and indent the lines below (blank line = new paragraph).
- question: "Do you have Single Day or Shopping-Only rates?"
  answer: "No. This event has a retreat-like atmosphere which would be disrupted by this."
- question: "Can I register at the door?"
  answer: "Yes, however, pre-registration is required to obtain accommodations/meals and assists us in site preparations."
- question: "Do you provide a Children's Program or Child-care?"
  answer: "No. This conference is a retreat for parents. Mature young adults are welcome to register as a Youth with their parents, and should attend the sessions. Nursing babes are free to attend with their mother."
- question: "Is there place for mothers to nurse their babes?"
  answer: "Yes. The conference talks will be wired into the dedicated mother's room for those with unsettled, nursing infants."
- question: "Will there be books and resources available?"
  answer: "Yes. There will be a variety of new and used books and resources available for sale."
- question: "Can I sell my used materials at the Conference?"
  answer: "Please see the [Used Curriculum](/usedcurriculum.html) page for more information."
- question: "How do I change my registration?"
  answer: |
    Please email us at [wcchscreg@gmail.com](mailto:wcchscreg@gmail.com). We will get back to you.

    Earlybird and registration deadlines will apply.
- question: "Are there other food options available, including for those with dietary restrictions?"
  answer: |
    Yes, there are a variety of light fare options available in the Loonie Lounge, including muffins, fruit, oatmeal, eggs, yogurt and granola bars. The Loonie Lounge, located in the hospitality room, will be open Thursday evening to Saturday after lunch. Suggested donation is $1.00/item.

    There are a limited number of refrigerators available if you choose to bring your own food.

    There are gluten-free and dairy free options with meals purchased at the time of registration. **Please indicate this in the special instructions box when ordering your meal.**
- question: "Is there parking on site?"
  answer: "Yes. Parking is somewhat limited. Please obey directions to optimize space."
