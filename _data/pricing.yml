# PRICES - all in Canadian dollars. Numbers only (no $ sign).
# `price` is the REGULAR price. To add an early bird price to a row, add
# `early_bird: 100` to it. If any row in a table has `early_bird`, that table
# shows Early bird and Regular columns (rows without it show the regular price in both).
# Early bird columns only appear while `early_bird_deadline` in event.yml is set.

participant:
  - { name: "Single Adult",   price: 120, early_bird: 100 }
  - { name: "Married couple", price: 160, early_bird: 150 }
  - { name: "Student accompanying parent",  price: 50 }

accommodation:                     # per night
  - { name: "Single (remote bathroom)", price: 70 }
  - { name: "Double (with bathroom)",   price: 100 }
  - { name: "Extra person",             price: 10 }

meals:
  - { day: "Friday",   meal: "Breakfast", price: 14 }
  - { day: "Friday",   meal: "Lunch",     price: 21 }
  - { day: "Friday",   meal: "Supper",    price: 22 }
  - { day: "Saturday", meal: "Breakfast", price: 14 }
  - { day: "Saturday", meal: "Lunch",     price: 21 }

vendor:
  - { name: "Basic: 1 table / 2 reps", price: 150 }
  - { name: "Additional table",        price: 40 }
  - { name: "Additional rep",          price: 25 }

used_curriculum:
  registration_fee: 5
  commission_percent: 20
