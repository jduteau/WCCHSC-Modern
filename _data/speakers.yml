# SPEAKERS - one entry per speaker. Photo is optional (put the file in assets/img/speakers/).
# To hide a speaker, delete their entry or put a # at the start of each of their lines.
- name: "Marc Rouleau"
  talk: "Be Not Afraid to Lead as a Father"
  photo: ""
  bio: "Marc Rouleau is a husband of nearly 20 years and the proud father of eight sons. Living the joys and challenges of Catholic family life and home schooling, Marc is passionate about the vital role fathers play as leaders in the home. His talk, Leading as a Father, encourages men to embrace fatherhood as a mission rooted in faith, responsibility, and love."
- name: "Janice Laurence"
  talk: "Be Not Afraid to Focus on Basics"
  photo: ""
  bio: "Knowing she has nothing to fear because of the promises made by the good God, Janice and her husband, Joe, have been happily home schooling for 26 years. They are parents to 10, parents-in-law to 7, and grandparents to 11. Janice is grateful for the gifts of her faith and family and is happy to have this opportunity to share and hopefully be an encouragement to other home schooling families."
- name: "Thérèse McDonald"
  talk: "Be Not Afraid to Grow in your Teaching Style"
  photo: ""
  bio: "For over 30 years, Thérèse McDonald has accompanied parents in forming children in the Faith and as primary teachers in the home. As a practitioner in Mediated Learning, Therese knows that learners can overcome difficulties through God's Grace and in the perfect design of each of His children. She and her husband home educated for 22 years."
- name: "Deacon Ken Noster"
  talk: "Be Not Afraid of Teaching Truth, Goodness & Beauty as Core"
  photo: ""
  bio: "Kenneth Noster is a permanent deacon incardinated in the Archdiocese of Edmonton and on loan to the Personal Ordinariate of the Chair of St. Peter. He is a husband of over 50 years and father to 6 home schooled children, in turn home schooling 20 grandchildren. He has supported home schooling families for over 3 decades, guiding, teaching, and preaching."
- name: "Sue Peachment"
  talk: "Be Not Afraid to Teach High School"
  photo: ""
  bio: "Sue Peachment is a graduated home school mom, Catholic convert, and home school facilitator, all by the grace of God. She and her husband courageously home educated their four boys through high school and a bit beyond. Sue and Dean now enjoy trekking alongside their sons and daughters-in-law as they boldly raise their own future home schoolers."
