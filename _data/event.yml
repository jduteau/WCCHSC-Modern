  With the intent of helping support your homeschooling journey, this event is an occasion for prayer, fellowship and sharing insights.

  The retreat-like atmosphere provides opportunities for Holy Mass, Confession, Adoration, solid Catholic teaching, apostolates, a Catholic market and an evening social.

